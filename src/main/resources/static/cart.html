<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmesh K-mart | Your Cart</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body><div id="site-header"></div><div class="container page-head"><h1>Your cart</h1></div><div class="container" style="padding-bottom:80px"><div id="cartRoot"></div></div><div id="site-footer"></div><script src="/assets/js/app.js"></script><script>SS.renderHeader('shop');SS.renderFooter();const root=document.getElementById('cartRoot');async function load(){const user=await SS.requireAuth('/cart.html');if(!user)return;try{const items=await SS.api('/api/cart');if(!items.length){root.innerHTML='<div class="empty-state"><h3>Your cart is empty</h3><a href="/home.html#shop" class="btn btn-primary">Start shopping</a></div>';return;}root.innerHTML=items.map(i=>`<div class="line-row"><a href="/product.html?id=${i.product.id}">${SS.escapeHtml(i.product.name)}</a><span>${SS.money(i.product.price)} × ${i.quantity}</span></div>`).join('');}catch(e){root.innerHTML='<p>'+SS.escapeHtml(e.message)+'</p>';}}load();</script></body></html>
